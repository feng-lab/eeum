        class="mx-0 px-0 my-0 py-0"
        v-for="i in 178"
        :key="i"
        cols="12"
        xs="12"
        sm="6"
        md="6"
        lg="4"
        xl="4"
      >
        <img
          :src="`https://neutracing.com/static/static/reference_gallery/reference_with_atlas/elemur_slice${i+1}.png`"

          :class="$style.image"
          :key="`slice${i+1}`"
          :alt="`slice${i+1}`"

      </v-col>
    </v-row>
  </v-container>
</div>
